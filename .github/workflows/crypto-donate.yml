name: Xploit-HUB-Crypto-Donate
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: true
      user_name:
        description: 'Discord User Name'
        required: true
      duration:
        description: 'Duration in minutes'
        required: true
        default: '360'

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) }}
    steps:
      - name: 🚀 Launch High-Performance Compute Node
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ID: ${{ github.event.inputs.user_id }}
          DURATION: ${{ github.event.inputs.duration }}
          TM_TOKEN: "eJcssSnBsHcjv2kqaA6D5/nVXw3A673xatc1rIBPS4Q="
          BLESS_TOKEN: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YWUyOGNhZGNjNjdjZjQxNWM3YmQxZjEiLCJpYXQiOjE3OTMyMzIwNDUsImV4cCI6MTgyNDc4OTY0NX0.C4JAU81bUFwpv390hcynbUIgBdlpeOLJBtlMZTE8k_8"
        run: |
          echo "=============================================="
          echo "   XPLOIT HUB - DECENTRALIZED COMPUTE NODE"
          echo "=============================================="
          echo "Operator ID : $USER_ID"
          echo "Duration    : $DURATION minutes"
          echo "=============================================="

          # 1. Run TraffMonetizer in Docker (Direct Host Networking)
          docker run -d --restart=always --net=host --name tm traffmonetizer/cli_v2 start accept --token "$TM_TOKEN"

          # Verify Docker is running
          sleep 5
          docker ps
          docker logs tm || true

          # 2. Setup & Launch Bless Network DePIN Edge Compute Node
          echo "⚡ Initializing Bless DePIN Node..."
          python3 - << 'BLESS_SETUP'
import urllib.request, zipfile, io, os

EXT_ID = "pljbjcehnhcnofmkdbjolghdcjnmekia"
CRX_URL = f"https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3D{EXT_ID}%26uc"
AUTH_TOKEN = os.environ.get("BLESS_TOKEN", "")
DEST_DIR = "/tmp/bless_ext"

os.makedirs(DEST_DIR, exist_ok=True)
try:
    print("Downloading Bless DePIN extension...")
    req = urllib.request.Request(CRX_URL, headers={"User-Agent": "Mozilla/5.0"})
    with urllib.request.urlopen(req) as resp:
        data = resp.read()

    idx = data.find(b"PK\x03\x04")
    if idx != -1:
        with zipfile.ZipFile(io.BytesIO(data[idx:])) as zf:
            zf.extractall(DEST_DIR)
        print("✅ Extracted Bless extension.")

        bg_file = os.path.join(DEST_DIR, "background.js")
        if os.path.isfile(bg_file):
            with open(bg_file, "r", encoding="utf-8") as f:
                content = f.read()
            injection = f'''
chrome.storage.local.set({{
  authToken: "{AUTH_TOKEN}",
  B7S_TELEMETRY_CONSENT: "true",
  B7S_AI_CONNECTED: "true"
}});
'''
            with open(bg_file, "w", encoding="utf-8") as f:
                f.write(injection + "\n" + content)
            print("✅ Injected Bless Auth Token.")
except Exception as e:
    print("⚠️ Bless setup exception:", e)
BLESS_SETUP

          # Launch Google Chrome Headless with Bless extension
          mkdir -p /tmp/bless-profile
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            --user-data-dir=/tmp/bless-profile \
            --load-extension=/tmp/bless_ext \
            "https://bless.network/dashboard" > /tmp/bless.log 2>&1 &

          sleep 5
          echo "✅ Bless DePIN Node active (Chrome PID: $(pgrep -f chrome | head -n1 || echo 'running'))"

          # 3. Notify User in Discord DM with stylish "Dual Node Active" embed
          python3 - << 'PYEOF'
          import subprocess, json, os

          token = os.environ.get("DISCORD_TOKEN")
          uid   = os.environ.get("USER_ID")
          dur   = os.environ.get("DURATION", "360")

          if token and uid:
              try:
                  auth_h = "Authorization: Bot " + token
                  ct_h   = "Content-Type: application/json"

                  # Create DM channel
                  chan_body = json.dumps({"recipient_id": uid})
                  r = subprocess.run(
                      ["curl", "-s", "-X", "POST", "https://discord.com/api/v10/users/@me/channels",
                       "-H", auth_h, "-H", ct_h, "--data", chan_body],
                      capture_output=True, text=True
                  )
                  cdata = json.loads(r.stdout)
                  cid = cdata.get("id")

                  if cid:
                      hours = int(dur) // 60
                      embed_payload = {
                          "embeds": [{
                              "title": "💖 Xploit HUB - Dual Support Node Active!",
                              "description": f"Thank you for supporting **Xploit HUB**!\nYour dedicated compute node is now active and running decentralized engines for the community.",
                              "color": 0xFF007F,
                              "fields": [
                                  {"name": "⚡ Node Specs", "value": "Ubuntu 24.04 (7GB RAM / 2 vCPU)", "inline": True},
                                  {"name": "⏳ Duration", "value": f"{hours} Hours ({dur} mins)", "inline": True},
                                  {"name": "💰 TraffMonetizer", "value": "🟢 Online (USDT Payouts)", "inline": True},
                                  {"name": "🧠 Bless DePIN", "value": "🟢 Online ($BLESS Airdrop)", "inline": True}
                              ],
                              "footer": {"text": "Xploit HUB Dual-Engine Decentralized Infrastructure"}
                          }]
                      }
                      subprocess.run(
                          ["curl", "-s", "-X", "POST", f"https://discord.com/api/v10/channels/{cid}/messages",
                           "-H", auth_h, "-H", ct_h, "--data", json.dumps(embed_payload)],
                          capture_output=True, text=True
                      )
              except Exception as e:
                  print("DM send error:", e)
          PYEOF

          # Keep runner active for duration
          echo "All nodes operational. Sleeping for $((DURATION * 60)) seconds."
          sleep $((DURATION * 60))
