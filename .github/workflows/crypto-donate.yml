name: Xploit-HUB-Crypto-Donate
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: true
      user_name:
        description: 'Discord User Name'
        required: true
      duration:
        description: 'Duration in minutes'
        required: true
        default: '360'

jobs:
  launch:
    runs-on: windows-2022
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) }}
    steps:
      - name: 🚀 Turbocharge Virtual RAM (16GB NVMe Pagefile) & Network Engine
        shell: powershell
        run: |
          Write-Host "Configuring 16GB Virtual Memory (Pagefile)..."
          Set-CimInstance -Query "SELECT * FROM Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $False}
          $pagefile = Get-CimInstance -ClassName Win32_PageFileSetting -Filter "Name like 'C:%'" -ErrorAction SilentlyContinue
          if ($pagefile) {
            $pagefile | Set-CimInstance -Property @{InitialSize = 16384; MaximumSize = 16384}
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = 'C:\pagefile.sys'; InitialSize = 16384; MaximumSize = 16384}
          }
          Write-Host "✅ 16GB High-Speed NVMe Pagefile Active! Total System Memory: ~23GB"

          Write-Host "Optimizing TCP latency & unthrottling network throughput..."
          $tcpParams = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
          if (Test-Path $tcpParams) {
            Get-ChildItem $tcpParams -ErrorAction SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name 'TCPNoDelay' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name 'TcpDelAckTicks' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
            }
          }

          $sysProfile = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
          if (-not (Test-Path $sysProfile)) { New-Item -Path $sysProfile -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $sysProfile -Name 'NetworkThrottlingIndex' -Value 0xFFFFFFFF -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $sysProfile -Name 'SystemResponsiveness' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue

          $priCtrl = 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl'
          if (-not (Test-Path $priCtrl)) { New-Item -Path $priCtrl -Force -ErrorAction SilentlyContinue | Out-Null }
          Set-ItemProperty -Path $priCtrl -Name 'Win32PrioritySeparation' -Value 38 -Type DWord -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Zero-Delay TCP & High-Throughput Network Engine Active!"

      - name: 🛡 Disable Windows Defender Real-Time Protection
        shell: powershell
        run: |
          Write-Host "Disabling Windows Defender to allow proxyware tools..."
          # Disable real-time monitoring — it quarantines proxyware like TraffMonetizer (Wacatac false positive)
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "C:\Traffmonetizer" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:APPDATA\Traffmonetizer" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
          Write-Host "✅ Defender real-time protection disabled + exclusions set!"

      - name: ⚙ Deploy TraffMonetizer Windows Engine & Auto-Login
        shell: powershell
        env:
          TM_TOKEN: "eJcssSnBsHcjv2kqaA6D5/nVXw3A673xatc1rIBPS4Q="
        run: |
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "=============================================="
          Write-Host "   XPLOIT HUB - WINDOWS HIGH-SPEED NODE"
          Write-Host "=============================================="

          # 1. Pre-configure settings.json with account token and auto-accept
          $appDataDir = "$env:APPDATA\Traffmonetizer"
          New-Item -ItemType Directory -Force -Path $appDataDir | Out-Null
          $settingsObj = [pscustomobject]@{
            Token = $env:TM_TOKEN
            StartWithWindows = $true
            Accepting = $true
          }
          $jsonContent = $settingsObj | ConvertTo-Json
          Set-Content -Path "$appDataDir\settings.json" -Value $jsonContent -Encoding UTF8 -Force
          Write-Host "✅ settings.json configured with access token!"

          # 2. Download official Windows installer from updated .io domain
          $installDir = "C:\Traffmonetizer"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installerPath = "$env:TEMP\TM_Setup.exe"
          Write-Host "Downloading TraffMonetizer from traffmonetizer.io..."
          Invoke-WebRequest -Uri 'https://data.traffmonetizer.io/downloads/Traffmonetizer.exe' -OutFile $installerPath -UseBasicParsing
          Write-Host "Downloaded size: $((Get-Item $installerPath).Length / 1KB) KB"

          # Verify file exists and not quarantined by Defender
          if (-not (Test-Path $installerPath)) {
            Write-Host "ERROR: File was quarantined by Defender even after exclusion. Trying curl fallback..."
            curl.exe -sL 'https://data.traffmonetizer.io/downloads/Traffmonetizer.exe' -o $installerPath
          }

          # 3. Extract portable application payload directly from installer package
          Write-Host "Extracting high-performance client binaries..."
          try {
            $bytes = [System.IO.File]::ReadAllBytes($installerPath)
            $asm = [System.Reflection.Assembly]::Load($bytes)
            $stream = $asm.GetManifestResourceStream("Installer.Resources.resources")
            $rr = New-Object System.Resources.ResourceReader($stream)
            $dict = $rr.GetEnumerator()
            $zipBytes = $null
            while ($dict.MoveNext()) {
              if ($dict.Key -eq "net461") {
                $zipBytes = $dict.Value
                break
              }
            }
            if ($zipBytes) {
              # In v1.1.3.42+, payload is obfuscated - decode using internal Utils.DecodePayload
              $utils = $asm.GetType("Installer.Internals.Utils")
              if ($utils) {
                $decode = $utils.GetMethod("DecodePayload", [System.Reflection.BindingFlags]'Public,NonPublic,Static,Instance')
                if ($decode) {
                  $zipBytes = $decode.Invoke($null, [object[]]@(, $zipBytes))
                }
              }
              $tempZip = "$env:TEMP\tm_payload.zip"
              [System.IO.File]::WriteAllBytes($tempZip, $zipBytes)
              Expand-Archive -LiteralPath $tempZip -DestinationPath $installDir -Force
              Write-Host "SUCCESS: Client binaries unpacked directly to $installDir!"
            } else {
              throw "net461 resource not found"
            }
          } catch {
            Write-Host "Unpack error: $_"
            Write-Host "Fallback: running installer with /i /s flags..."
            Start-Process -FilePath $installerPath -ArgumentList '/i','/s' -Wait -NoNewWindow -ErrorAction SilentlyContinue
          }

          # 4. Find and launch Traffmonetizer.exe in background (hidden, no GUI)
          $candidatePaths = @(
            "$installDir\Traffmonetizer.exe",
            "$env:LOCALAPPDATA\Programs\Traffmonetizer\Traffmonetizer.exe",
            "$env:ProgramFiles\Traffmonetizer\Traffmonetizer.exe"
          )
          $binPath = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($binPath) {
            Write-Host "Starting TraffMonetizer from: $binPath"
            Start-Process -FilePath $binPath -WindowStyle Hidden
            Start-Sleep -Seconds 8
            $proc = Get-Process -Name "Traffmonetizer" -ErrorAction SilentlyContinue
            if ($proc) {
              Write-Host "SUCCESS: TraffMonetizer PID $($proc.Id) is running natively at full bandwidth!"
            } else {
              Write-Host "WARNING: Process not visible - may be running as child. Listing all traff* processes:"
              Get-Process | Where-Object { $_.ProcessName -like "*traff*" -or $_.ProcessName -like "*Traff*" } | Select-Object Id, ProcessName
            }
          } else {
            Write-Host "WARNING: Binary not found in known paths. Listing installed dir:"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | Select-Object Name, Length
          }

      - name: 🔔 Notify User in Discord DM
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ID: ${{ github.event.inputs.user_id }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          $TOKEN = $env:DISCORD_TOKEN
          $UID   = $env:USER_ID
          $DUR   = $env:DURATION
          if (-not $TOKEN -or -not $UID) {
            Write-Host "Discord credentials missing, skipping notification."
            exit 0
          }

          $hours = [math]::Floor([int]$DUR / 60)
          $AUTH  = "Authorization: Bot $TOKEN"
          $CT    = "Content-Type: application/json"

          $chanFile = "$env:TEMP\tm_chan.json"
          [System.IO.File]::WriteAllText($chanFile, (ConvertTo-Json -Compress @{ recipient_id = $UID }), [System.Text.UTF8Encoding]::new($false))

          $CID = $null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $chanResp = curl.exe -s -X POST 'https://discord.com/api/v10/users/@me/channels' -H $AUTH -H $CT --data "@$chanFile"
            $chanObj = $chanResp | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($chanObj.id) { $CID = $chanObj.id; break }
            Start-Sleep -Seconds 2
          }

          if ($CID) {
            $embedPayload = @{
              embeds = @(
                @{
                  title = "💖 Xploit HUB - Support Node Active!"
                  description = "Thank you for supporting **Xploit HUB**!`nYour dedicated compute node is now active and routing high-speed decentralized bandwidth for the community."
                  color = 16711807
                  fields = @(
                    @{ name = "⚡ Node Engine"; value = "Windows Server 2022 (Native 16GB + 16GB NVMe Pagefile)"; inline = $true },
                    @{ name = "⏳ Duration"; value = "$hours Hours ($DUR mins)"; inline = $true },
                    @{ name = "🚀 Performance"; value = "🟢 100% Unthrottled Native Bandwidth"; inline = $true }
                  )
                  footer = @{ text = "Xploit HUB Decentralized Infrastructure" }
                }
              )
            }
            $msgFile = "$env:TEMP\tm_msg.json"
            [System.IO.File]::WriteAllText($msgFile, (ConvertTo-Json -Compress -Depth 5 $embedPayload), [System.Text.UTF8Encoding]::new($false))
            curl.exe -s -X POST "https://discord.com/api/v10/channels/$CID/messages" -H $AUTH -H $CT --data "@$msgFile"
            Write-Host "✅ Discord DM sent successfully!"
          }

      - name: ⏱ Keep Node Active
        shell: powershell
        env:
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          $durMinutes = [int]$env:DURATION
          Write-Host "Compute Node is actively sharing bandwidth. Sleeping for $durMinutes minutes..."
          $totalSeconds = $durMinutes * 60
          $elapsed = 0
          while ($elapsed -lt $totalSeconds) {
            Start-Sleep -Seconds 60
            $elapsed += 60
            # Periodically ensure process is alive
            $p = Get-Process -Name "Traffmonetizer" -ErrorAction SilentlyContinue
            if (-not $p) {
              Write-Host "Restarting process if closed..."
              Start-Process -FilePath "C:\Traffmonetizer\Traffmonetizer.exe" -WindowStyle Hidden -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Session completed."
