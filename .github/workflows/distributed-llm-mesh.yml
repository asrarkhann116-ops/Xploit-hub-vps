name: ⚡ Distributed-LLM-Mesh

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Choose Abliterated (Uncensored) Model'
        required: true
        default: 'qwen2.5-coder-14b-abliterated'
        type: choice
        options:
          - qwen2.5-coder-14b-abliterated
          - qwen3.8-27b-abliterated
          - qwen2.5-coder-32b-abliterated
          - qwen2.5-coder-7b-abliterated
          - qwen2.5-coder-1.5b
      nodes_limit:
        description: 'Active Compute Nodes (auto: high speed, or max: all 60+ nodes)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '4'
          - '8'
          - '16'
          - 'max'

jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Turbocharge Virtual RAM (16GB NVMe Swap = 23GB Total)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ 23GB System Address Space Unlocked on Coordinator"

      - name: 🌐 Connect Tailscale Mesh
        env:
          TS_AUTHKEY: "tskey-auth-kXcDp6s2P321CNTRL-F5aZFRYRiDKGukMPBzvBEKZM27iVe7rh"
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${TS_AUTHKEY}" --hostname="xploit-coordinator" --accept-routes
          COORD_IP=$(tailscale ip -4)
          echo "✅ Coordinator Live on IP: ${COORD_IP}"
          echo "COORD_IP=${COORD_IP}" >> $GITHUB_ENV

      - name: 🔍 Discover Active Workers on Mesh
        id: discover
        run: |
          echo "[*] Scanning Tailscale peer status for xploit-worker nodes..."
          python3 -c "
          code = '''
          import sys, json
          try:
              data = json.load(sys.stdin)
              peers = data.get('Peer', {})
              ips = []
              for k, p in peers.items():
                  h = p.get('HostName', '')
                  if 'xploit-worker' in h and p.get('Online', False):
                      ip = p.get('TailscaleIPs', [''])[0]
                      if ip: ips.append(f'{ip}:50052')
              print(','.join(ips))
          except Exception:
              print('')
          '''
          open('/tmp/find_workers.py', 'w').write(code)
          "
          for i in $(seq 1 30); do
            WORKERS=$(tailscale status --json | python3 /tmp/find_workers.py)
            if [ -n "$WORKERS" ]; then
              echo "✅ Discovered Online RPC Workers: $WORKERS"
              echo "workers=$WORKERS" >> $GITHUB_OUTPUT
              break
            fi
            echo "[-] Waiting for workers to join Tailscale mesh ($i/30)..."
            sleep 5
          done

          if [ -z "$WORKERS" ]; then
            echo "❌ No workers found in 2.5 minutes!"
            exit 1
          fi

      - name: 🧠 Download Model & Launch Distributed Master Server
        env:
          CHOSEN_MODEL: ${{ github.event.inputs.model_name }}
          CHOSEN_NODES: ${{ github.event.inputs.nodes_limit }}
          WORKERS: ${{ steps.discover.outputs.workers }}
        run: |
          mkdir -p /tmp/llama && cd /tmp/llama

          if [ "$CHOSEN_MODEL" = "qwen2.5-coder-14b-abliterated" ]; then
            DOWNLOAD_URL="https://huggingface.co/bartowski/Qwen2.5-Coder-14B-Instruct-abliterated-GGUF/resolve/main/Qwen2.5-Coder-14B-Instruct-abliterated-Q4_K_M.gguf"
            TARGET_NODES=4
          elif [ "$CHOSEN_MODEL" = "qwen3.8-27b-abliterated" ]; then
            DOWNLOAD_URL="https://huggingface.co/mradermacher/Swift-Qwen3.8-27B-Abliterated-GGUF/resolve/main/Swift-Qwen3.8-27B-Abliterated.Q4_K_M.gguf"
            TARGET_NODES=8
          elif [ "$CHOSEN_MODEL" = "qwen2.5-coder-32b-abliterated" ]; then
            DOWNLOAD_URL="https://huggingface.co/bartowski/Qwen2.5-Coder-32B-Instruct-abliterated-GGUF/resolve/main/Qwen2.5-Coder-32B-Instruct-abliterated-Q4_K_M.gguf"
            TARGET_NODES=8
          elif [ "$CHOSEN_MODEL" = "qwen2.5-coder-7b-abliterated" ]; then
            DOWNLOAD_URL="https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-abliterated-Q4_K_M.gguf"
            TARGET_NODES=2
          else
            DOWNLOAD_URL="https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
            TARGET_NODES=2
          fi

          # Override target nodes if user selected specific limit or max
          if [ "$CHOSEN_NODES" = "max" ]; then
            TARGET_NODES=128
          elif [ -n "$CHOSEN_NODES" ] && [ "$CHOSEN_NODES" != "auto" ]; then
            TARGET_NODES="$CHOSEN_NODES"
          fi

          TOTAL_FOUND=$(echo "$WORKERS" | tr ',' '\n' | wc -l)
          echo "🌐 Total Active Workers Discovered on Mesh: $TOTAL_FOUND"

          # Active Pool: up to TARGET_NODES (1:1 Dedicated Node per Model Layer)
          RPC_WORKERS=$(echo "$WORKERS" | tr ',' '\n' | head -n "$TARGET_NODES" | paste -sd, -)
          ACTIVE_COUNT=$(echo "$RPC_WORKERS" | tr ',' '\n' | wc -l)

          # Standby / Reserve Pool: any workers beyond TARGET_NODES
          RESERVE_WORKERS=$(echo "$WORKERS" | tr ',' '\n' | tail -n +$((TARGET_NODES + 1)) | paste -sd, -)
          RESERVE_COUNT=0
          if [ -n "$RESERVE_WORKERS" ]; then
            RESERVE_COUNT=$(echo "$RESERVE_WORKERS" | tr ',' '\n' | wc -l)
          fi

          echo "$RPC_WORKERS" | tr ',' '\n' > /tmp/active_workers.txt
          echo "$RESERVE_WORKERS" | tr ',' '\n' > /tmp/reserve_workers.txt

          echo "=========================================================="
          echo "⚡ DISTRIBUTED WORKER ALLOCATION:"
          echo "🔹 Active 1:1 Compute Nodes  : $ACTIVE_COUNT nodes"
          echo "🔹 Standby / Reserve Backups : $RESERVE_COUNT nodes"
          echo "=========================================================="

          echo "### ⚡ Distributed LLM Cluster Allocation" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Discovered Workers:** $TOTAL_FOUND nodes" >> $GITHUB_STEP_SUMMARY
          echo "- **Active 1:1 Layer Nodes:** $ACTIVE_COUNT nodes" >> $GITHUB_STEP_SUMMARY
          echo "- **Standby Backup Nodes:** $RESERVE_COUNT nodes" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RESERVE_WORKERS" ]; then
            echo "<details><summary>Click to view $RESERVE_COUNT Reserve Backup Node IPs</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$RESERVE_WORKERS" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          # Start model download in background
          echo "[*] Downloading GGUF model: $CHOSEN_MODEL from $DOWNLOAD_URL..."
          curl -fL --progress-bar "$DOWNLOAD_URL" -o model.gguf &
          DL_PID=$!

          # Setup llama-server: always compile with -DGGML_RPC=ON and GGML_SCHED_MAX_BACKENDS=128
          echo "[*] Compiling custom llama-server with native RPC & 128-backend support..."
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama-src
          
          # Patch hardcoded macro directly in source file
          sed -i 's/#define GGML_SCHED_MAX_BACKENDS 16/#define GGML_SCHED_MAX_BACKENDS 128/g' /tmp/llama-src/ggml/src/ggml-backend.cpp
          echo "Patched ggml-backend.cpp:"
          grep "GGML_SCHED_MAX_BACKENDS" /tmp/llama-src/ggml/src/ggml-backend.cpp | head -n 3

          cmake -B /tmp/llama-build -S /tmp/llama-src \
            -DGGML_RPC=ON \
            -DCMAKE_C_FLAGS="-DGGML_SCHED_MAX_BACKENDS=128" \
            -DCMAKE_CXX_FLAGS="-DGGML_SCHED_MAX_BACKENDS=128" \
            -DGGML_NATIVE=ON \
            -DGGML_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build /tmp/llama-build --config Release --target llama-server -j $(nproc)
          cp -r /tmp/llama-build/bin/* /tmp/llama/ 2>/dev/null || true
          chmod +x /tmp/llama/llama-server
          echo "✅ Custom 128-backend RPC llama-server compiled successfully!"
          export LD_LIBRARY_PATH=/tmp/llama:$LD_LIBRARY_PATH

          echo "[*] Waiting for model download to complete..."
          wait $DL_PID

          # Verify GGUF Magic Header
          MAGIC=$(head -c 4 model.gguf)
          if [ "$MAGIC" != "GGUF" ]; then
            echo "❌ ERROR: Downloaded file is not a valid GGUF file! Magic bytes: $MAGIC"
            cat model.gguf | head -n 10
            exit 1
          fi
          echo "✅ GGUF Magic Header verified: $MAGIC"

          echo "🚀 Launching Distributed llama-server over RPC mesh with $ACTIVE_COUNT worker nodes:"
          echo "Endpoints: $RPC_WORKERS"
          
          # Launch llama-server with layer-by-layer RPC distribution and clean model alias
          ./llama-server \
            -m model.gguf \
            --alias "$CHOSEN_MODEL" \
            --rpc "$RPC_WORKERS" \
            --split-mode layer \
            --host 0.0.0.0 \
            --port 8080 \
            -t 2 \
            -c 4096 > /tmp/llama-server.log 2>&1 &
          LLAMA_PID=$!

          echo "[*] Waiting for server warm-up and 17.5GB layer distribution across $ACTIVE_COUNT nodes (PID: $LLAMA_PID)..."
          LOADED=0
          # Allow up to 15 minutes for 17.5GB network distribution over 14 WireGuard nodes
          for i in $(seq 1 180); do
            if ! kill -0 $LLAMA_PID 2>/dev/null; then
              echo "❌ ERROR: llama-server process died unexpectedly! Crash log:"
              cat /tmp/llama-server.log
              exit 1
            fi
            if curl -s http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              LOADED=1
              echo "✅ Model successfully loaded across distributed cluster!"
              break
            fi
            # Every 10 iterations (~50s), print current progress from server log
            if [ $((i % 10)) -eq 0 ]; then
              echo "[-] Loading progress ($i/180):"
              tail -n 3 /tmp/llama-server.log || true
            else
              echo "[-] Distributing layers across RPC nodes ($i/180)..."
            fi
            sleep 5
          done

          if [ $LOADED -eq 0 ]; then
            echo "❌ ERROR: Model loading timed out! Dumping server log:"
            cat /tmp/llama-server.log
            exit 1
          fi

          echo "[*] Installing Cloudflare Tunnel..."
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          echo "🚀 Starting Cloudflare Tunnel for Public Web Access..."
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 > /tmp/tunnel.log 2>&1 &

          echo "[*] Polling for Cloudflare Tunnel public URL..."
          TUNNEL_URL=""
          for t in $(seq 1 25); do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done

          echo "=========================================================="
          echo "🎉 DISTRIBUTED LLM CLUSTER IS LIVE & PUBLIC!"
          echo "🔗 Public Web UI & API Link: $TUNNEL_URL"
          echo "🌐 Tailscale Direct IP     : http://${COORD_IP}:8080"
          echo "🤖 Model Alias Loaded      : $CHOSEN_MODEL"
          echo "=========================================================="

          echo "[*] Running verification prompt via OpenAI-compatible endpoint..."
          curl -s http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$CHOSEN_MODEL\",
              \"messages\": [{\"role\": \"user\", \"content\": \"Hello! Confirm if distributed RPC inference is working and introduce yourself in 2 lines.\"}]
            }" | python3 -m json.tool

          # Keep alive for testing
          sleep 1800
