name: 🛑 Kill-All-LLM-Nodes

on:
  workflow_dispatch:

jobs:
  kill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mother-Cluster
            token_secret: MOTHER_PAT
            target: "asrarkhann116-ops/Xploit-hub-vps"
          - name: Cluster-12
            token_secret: CLUSTER_12_PAT
            target: "asrarkhann122-eng/ubiquitous-sniffle"
          - name: Cluster-13
            token_secret: CLUSTER_13_PAT
            target: "asrarkhann119-eng/pxloit-buh-spv"
          - name: Cluster-14
            token_secret: CLUSTER_14_PAT
            target: "asrarkhann136-coder/crook"
          - name: Cluster-15
            token_secret: CLUSTER_15_PAT
            target: "termuxhexrt/Xploit-VPS-System"
          - name: Cluster-16
            token_secret: CLUSTER_16_PAT
            target: "asrarkhann145-spec/spec-about-dell-latitude-e6540"
          - name: Cluster-17
            token_secret: CLUSTER_17_PAT
            target: "arvindvincenzo/Xploit-hub-vpsq"
    steps:
      - name: Cancel all running LLM nodes on ${{ matrix.name }}
        env:
          CLUSTER_PAT: ${{ secrets[matrix.token_secret] || secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$CLUSTER_PAT" ]; then
            echo "⚠️ No PAT for ${{ matrix.name }}, skipping..."
            exit 0
          fi
          echo "🛑 Finding running LLM workers & coordinators on ${{ matrix.name }} ($TARGET)..."

          cat << 'PYEOF' > /tmp/parse_runs.py
          import sys, json
          try:
              data = json.load(sys.stdin)
              runs = data.get("workflow_runs", [])
              ids = [str(r["id"]) for r in runs if r.get("status") in ["in_progress", "queued"]]
              print(" ".join(ids))
          except Exception:
              print("")
          PYEOF

          for WF in "llm-worker-node.yml" "distributed-llm-mesh.yml" "mass-dispatch-llm-mesh.yml"; do
            RUNS=$(curl -s -H "Authorization: token $CLUSTER_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$TARGET/actions/workflows/$WF/runs?per_page=100")

            RUN_IDS=$(echo "$RUNS" | python3 /tmp/parse_runs.py)

            if [ -n "$RUN_IDS" ]; then
              for ID in $RUN_IDS; do
                echo "🛑 Cancelling $WF run ID: $ID on ${{ matrix.name }}..."
                curl -s -X POST -H "Authorization: token $CLUSTER_PAT" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$TARGET/actions/runs/$ID/cancel"
              done
            fi
          done
          echo "✅ All active LLM nodes and workflows cancelled on ${{ matrix.name }}!"
