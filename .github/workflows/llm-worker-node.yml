name: ⚡ LLM-Worker-Node

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Cluster Node ID'
        required: false
        default: 'worker'
      user_name:
        description: 'Node Name'
        required: false
        default: 'llm-node'
      duration:
        description: 'Duration in minutes'
        required: false
        default: '360'

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 🚀 Turbocharge Virtual RAM (16GB NVMe Swap = 23GB Total)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ 23GB System Address Space Unlocked!"

      - name: 🌐 Connect Tailscale Mesh
        env:
          TS_AUTHKEY: "tskey-auth-kXcDp6s2P321CNTRL-F5aZFRYRiDKGukMPBzvBEKZM27iVe7rh"
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          RAND_ID=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 6 | head -n 1)
          HOSTNAME="xploit-worker-${RAND_ID}"
          sudo tailscale up --authkey="${TS_AUTHKEY}" --hostname="${HOSTNAME}" --accept-routes
          NODE_IP=$(tailscale ip -4)
          echo "✅ Connected to Tailscale Mesh as ${HOSTNAME} with IP: ${NODE_IP}"

      - name: ⚙️ Setup & Launch ggml-rpc-server
        run: |
          mkdir -p /tmp/llama && cd /tmp/llama
          TAG="b12255"
          echo "[*] Downloading llama.cpp release ${TAG}..."
          curl -sL "https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-ubuntu-x64.tar.gz" -o llama.tar.gz
          tar -xzf llama.tar.gz --strip-components=1
          chmod +x ggml-rpc-server || true

          echo "🚀 Starting ggml-rpc-server on 0.0.0.0:50052 (Listening via Tailscale)..."
          ./ggml-rpc-server -H 0.0.0.0 -p 50052

