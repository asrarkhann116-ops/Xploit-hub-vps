name: 🚀 Mass-Dispatch-LLM-Mesh

on:
  workflow_dispatch:
    inputs:
      nodes_per_cluster:
        description: 'How many worker nodes to launch per cluster (1-10)'
        required: true
        default: '5'

jobs:
  dispatch-workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mother-Cluster
            token_secret: MOTHER_PAT
            target: "asrarkhann116-ops/Xploit-hub-vps"
          - name: Cluster-12
            token_secret: CLUSTER_12_PAT
            target: "asrarkhann122-eng/ubiquitous-sniffle"
          - name: Cluster-13
            token_secret: CLUSTER_13_PAT
            target: "asrarkhann119-eng/pxloit-buh-spv"
          - name: Cluster-14
            token_secret: CLUSTER_14_PAT
            target: "asrarkhann136-coder/crook"
          - name: Cluster-15
            token_secret: CLUSTER_15_PAT
            target: "termuxhexrt/Xploit-VPS-System"
          - name: Cluster-16
            token_secret: CLUSTER_16_PAT
            target: "asrarkhann145-spec/spec-about-dell-latitude-e6540"
    steps:
      - name: Trigger Worker Swarm on ${{ matrix.name }}
        env:
          CLUSTER_PAT: ${{ secrets[matrix.token_secret] || secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          NODES: ${{ github.event.inputs.nodes_per_cluster }}
        run: |
          if [ -z "$CLUSTER_PAT" ]; then
            echo "⚠️ No PAT for ${{ matrix.name }}, skipping..."
            exit 0
          fi
          echo "🚀 Mass Dispatching $NODES LLM Worker Nodes to ${{ matrix.name }} ($TARGET)..."
          for i in $(seq 1 $NODES); do
            curl -s -X POST "https://api.github.com/repos/$TARGET/actions/workflows/distributed-llm-mesh.yml/dispatches" \
              -H "Authorization: token $CLUSTER_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              -d '{"ref":"main","inputs":{"role":"worker"}}'
            sleep 1
          done
          echo "✅ Dispatched $NODES nodes to ${{ matrix.name }}!"
