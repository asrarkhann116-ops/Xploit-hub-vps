name: Xploit-HUB-RDP
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: true
      user_name:
        description: 'Discord User Name'
        required: true
      duration:
        description: 'Duration in minutes'
        required: true
        default: '60'
      wallpaper_url:
        description: 'Wallpaper URL'
        required: false
        default: 'https://raw.githubusercontent.com/asrarkhann116-ops/Xploit-hub-vps/main/xploit_hub_vps_wallpaper.png'
      cf_token:
        description: 'Cloudflare Tunnel Token (Optional for Zero Trust)'
        required: false
        default: ''

jobs:
  launch:
    runs-on: windows-2022
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) }}
    steps:
      - name: 🚀 Turbocharge Virtual RAM (16GB NVMe Pagefile)
        shell: powershell
        run: |
          Write-Host "Configuring 16GB Virtual Memory (Pagefile)..."
          Set-CimInstance -Query "SELECT * FROM Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $False}
          $pagefile = Get-CimInstance -ClassName Win32_PageFileSetting -Filter "Name like 'C:%'" -ErrorAction SilentlyContinue
          if ($pagefile) {
            $pagefile | Set-CimInstance -Property @{InitialSize = 16384; MaximumSize = 16384}
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = 'C:\pagefile.sys'; InitialSize = 16384; MaximumSize = 16384}
          }
          Write-Host "✅ 16GB High-Speed NVMe Pagefile Active! Total System Memory: ~23GB"

      - name: Enable RDP & Create User + Apply Wallpaper
        shell: powershell
        env:
          WALLPAPER_URL: ${{ github.event.inputs.wallpaper_url || 'https://raw.githubusercontent.com/asrarkhann116-ops/Xploit-hub-vps/main/xploit_hub_vps_wallpaper.png' }}
        run: |
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding

          secedit /export /cfg C:\secpol.cfg /quiet
          (Get-Content 'C:\secpol.cfg') -replace 'PasswordComplexity = 1','PasswordComplexity = 0' |
            Set-Content 'C:\secpol.cfg'
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /quiet
          Write-Host 'Password complexity disabled'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0

          $pw = ConvertTo-SecureString 'phantom' -AsPlainText -Force
          $u = Get-LocalUser -Name 'xploit' -ErrorAction SilentlyContinue
          if ($u) {
            Set-LocalUser -Name 'xploit' -Password $pw -ErrorAction SilentlyContinue
          } else {
            New-LocalUser 'xploit' -Password $pw -PasswordNeverExpires -UserMayNotChangePassword -ErrorAction SilentlyContinue
          }
          Add-LocalGroupMember -Group 'Administrators'       -Member 'xploit' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'xploit' -ErrorAction SilentlyContinue

          $check = Get-LocalUser -Name 'xploit' -ErrorAction SilentlyContinue
          if ($check) { Write-Host 'SUCCESS: user xploit ready' } else { Write-Host 'ERROR: user xploit not found'; exit 1 }

          # Download and force apply default wallpaper across all sessions
          try {
            $wallDir = 'C:\Windows\Web\Wallpaper\Xploit'
            New-Item -ItemType Directory -Force -Path $wallDir -ErrorAction SilentlyContinue | Out-Null
            $wallFile = "$wallDir\wallpaper.png"
            Invoke-WebRequest -Uri $env:WALLPAPER_URL -OutFile $wallFile -UseBasicParsing -ErrorAction SilentlyContinue

            if (Test-Path $wallFile) {
              # 1. Enforce System-wide Group Policy for Wallpaper (Locks desktop wallpaper for all users)
              $polKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
              New-Item -Path $polKey -Force -ErrorAction SilentlyContinue | Out-Null
              New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force -ErrorAction SilentlyContinue | Out-Null
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'Wallpaper' -Value $wallFile -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'WallpaperStyle' -Value '2' -Type String -Force -ErrorAction SilentlyContinue

              # 2. Overwrite Windows default img0.jpg & 4K cached wallpapers so Windows cannot load standard blue wallpaper
              takeown /f 'C:\Windows\Web\Wallpaper\Windows\img0.jpg' /a 2>$null
              icacls 'C:\Windows\Web\Wallpaper\Windows\img0.jpg' /grant 'Administrators:(F)' /q 2>$null
              Copy-Item -Path $wallFile -Destination 'C:\Windows\Web\Wallpaper\Windows\img0.jpg' -Force -ErrorAction SilentlyContinue

              if (Test-Path 'C:\Windows\Web\4K\Wallpaper\Windows') {
                takeown /f 'C:\Windows\Web\4K\Wallpaper\Windows\*' /a 2>$null
                icacls 'C:\Windows\Web\4K\Wallpaper\Windows\*' /grant 'Administrators:(F)' /q 2>$null
                Get-ChildItem 'C:\Windows\Web\4K\Wallpaper\Windows\*.jpg' | ForEach-Object {
                  Copy-Item -Path $wallFile -Destination $_.FullName -Force -ErrorAction SilentlyContinue
                }
              }

              # 3. Apply to default user registry so when 'xploit' logs in for the first time, wallpaper is already set
              reg load HKU\DefaultTemp C:\Users\Default\NTUSER.DAT 2>$null
              Set-ItemProperty -Path 'Registry::HKU\DefaultTemp\Control Panel\Desktop' -Name 'Wallpaper' -Value $wallFile -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'Registry::HKU\DefaultTemp\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '2' -Type String -Force -ErrorAction SilentlyContinue
              reg unload HKU\DefaultTemp 2>$null

              # 4. Also inject an autostart startup script into All Users Startup folder that calls SystemParametersInfo
              $startupDir = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
              New-Item -ItemType Directory -Force -Path $startupDir -ErrorAction SilentlyContinue | Out-Null
              $psCmd = 'Add-Type -TypeDefinition "using System; using System.Runtime.InteropServices; public class W { [DllImport(\"user32.dll\")] public static extern int SystemParametersInfo(int a, int b, string c, int d); }"; [W]::SystemParametersInfo(20, 0, \"C:\Windows\Web\Wallpaper\Xploit\wallpaper.png\", 3)'
              Set-Content -Path 'C:\Windows\set_wall.ps1' -Value $psCmd -Force
              Set-Content -Path "$startupDir\set_wall.cmd" -Value 'powershell.exe -ExecutionPolicy Bypass -NoProfile -WindowStyle Hidden -File C:\Windows\set_wall.ps1' -Force

              Write-Host "Wallpaper configured: $wallFile"
            }
          } catch {
            Write-Host "Wallpaper setup warning: $_"
          }

      - name: ⚡ Extreme RDP Gaming & 60 FPS Engine (Options 1, 2 & 3)
        shell: powershell
        run: |
          Write-Host "=================================================="
          Write-Host " Applying Extreme Performance RDP Tweaks..."
          Write-Host "=================================================="

          # ----------------------------------------------------
          # Option 1: Unlock Windows DWM 60 FPS Frame Rate
          # ----------------------------------------------------
          Write-Host "[*] Option 1: Unlocking 60 FPS in DWM & Terminal Server..."
          $tsKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          New-ItemProperty -Path $tsKey -Name 'DWM8FrameRate' -Value 60 -PropertyType DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsKey -Name 'DWM8FrameRate' -Value 60 -Type DWord -Force -ErrorAction SilentlyContinue

          # ----------------------------------------------------
          # Option 2: TCP NoDelay & Zero-Jitter Network Tweaks
          # ----------------------------------------------------
          Write-Host "[*] Option 2: Disabling Nagle Algorithm (TCPNoDelay & Immediate ACK)..."
          $interfaces = Get-NetAdapter | Where-Object { $_.Status -eq "Up" }
          foreach ($i in $interfaces) {
            $tcpPath = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\$($i.InterfaceGuid)"
            Set-ItemProperty -Path $tcpPath -Name "TcpAckFrequency" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $tcpPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "DefaultTTL" -Value 64 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "GlobalMaxTcpWindowSize" -Value 16777216 -Type DWord -Force -ErrorAction SilentlyContinue

          # ----------------------------------------------------
          # Option 3: Visual Effects & Hardware H.264 AVC444 Mode
          # ----------------------------------------------------
          Write-Host "[*] Option 3: Enforcing Hardware AVC444 & RemoteFX 3D Engine..."
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $policyPath -Force -ErrorAction SilentlyContinue | Out-Null

          Set-ItemProperty -Path $policyPath -Name "fEnableRemoteFXAdvancedRemoteFX" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "bEnumerateWithGpuEnumerate" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "EnableHost3DRendering" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "fEnableRemoteFXHWCodec" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "fEnableAVC444" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "selectnetworkdetect" -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "fEnableWddmDriverForRdp" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $policyPath -Name "VisualQuality" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

          # Enable Ultimate High Performance Power Scheme
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null

          Write-Host "✅ 60 FPS DWM Unlock, Zero-Jitter TCP, and RemoteFX AVC444 Applied!"

      - name: 🌐 Option 4 - Cloudflare Tunnel & Direct RDP Link
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN || github.event.inputs.cf_token }}
          USER_ID: ${{ github.event.inputs.user_id }}
          USER_NAME: ${{ github.event.inputs.user_name }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          $OutputEncoding = [Console]::InputEncoding = [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding
          $ProgressPreference = 'SilentlyContinue'

          # ----------------------------------------------------
          # 1. Start Cloudflare Tunnel (Option 4)
          # ----------------------------------------------------
          Write-Host "[*] Fetching Cloudflare Tunnel agent (cloudflared)..."
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile cloudflared.exe

          $CF_ACTIVE = $false
          $CF_MODE   = "None"
          $CF_URL    = ""

          if ($env:CLOUDFLARE_TOKEN -and $env:CLOUDFLARE_TOKEN.Trim() -ne '') {
            Write-Host "[*] Starting Cloudflare Zero Trust Tunnel with Token..."
            Start-Process -FilePath '.\cloudflared.exe' -ArgumentList 'tunnel','run','--token', $env:CLOUDFLARE_TOKEN.Trim() `
              -RedirectStandardOutput 'cf.log' -RedirectStandardError 'cf.err' -NoNewWindow
            $CF_ACTIVE = $true
            $CF_MODE   = "Zero Trust (Token)"
            Write-Host "✅ Cloudflare Zero Trust Active! Traffic routed via nearest Cloudflare Edge Pop (Mumbai/Delhi/SG)."
          } else {
            Write-Host "[*] Starting Cloudflare Quick Tunnel for port 3389..."
            Start-Process -FilePath '.\cloudflared.exe' -ArgumentList 'tunnel','--url','tcp://localhost:3389' `
              -RedirectStandardOutput 'cf.log' -RedirectStandardError 'cf.err' -NoNewWindow
            Start-Sleep 6
            if (Test-Path cf.err) {
              $cfLogs = Get-Content cf.err -Encoding UTF8 -ErrorAction SilentlyContinue
              foreach ($line in $cfLogs) {
                if ($line -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                  $CF_URL = $Matches[0]
                  $CF_ACTIVE = $true
                  $CF_MODE = "Quick Tunnel"
                  break
                }
              }
            }
          }

          # ----------------------------------------------------
          # 2. Start Direct Low-Latency TCP Tunnel (bore.pub)
          # ----------------------------------------------------
          Write-Host "[*] Launching Direct TCP Tunnel (bore.pub)..."
          Invoke-WebRequest 'https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip' -OutFile bore.zip
          Expand-Archive -LiteralPath bore.zip -DestinationPath . -Force

          Start-Process -FilePath '.\bore.exe' -ArgumentList 'local','3389','--to','bore.pub' `
            -RedirectStandardOutput 'bore.log' -RedirectStandardError 'bore.err' -NoNewWindow

          $PORT = ''
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep 3
            $log = @()
            if (Test-Path bore.log) { $log += Get-Content bore.log -Encoding UTF8 -ErrorAction SilentlyContinue }
            if (Test-Path bore.err) { $log += Get-Content bore.err -Encoding UTF8 -ErrorAction SilentlyContinue }
            foreach ($line in $log) {
              if ($line -match 'bore\.pub:(\d+)')   { $PORT = $Matches[1]; break }
              if ($line -match 'remote_port=(\d+)') { $PORT = $Matches[1]; break }
            }
            if ($PORT) { break }
          }

          if (-not $PORT -and -not $CF_ACTIVE) {
            Write-Host 'ERROR: Both Bore and Cloudflare tunnels failed.'; exit 1
          }

          Write-Host '=================================================='
          Write-Host '  WINDOWS 10 RDP - 60 FPS ULTRA PERFORMANCE'
          Write-Host '=================================================='
          Write-Host "  Direct RDP Host : bore.pub:$PORT"
          Write-Host "  Cloudflare Mode : $CF_MODE"
          if ($CF_URL) { Write-Host "  Cloudflare URL  : $CF_URL" }
          Write-Host '  Username        : xploit'
          Write-Host '  Password        : phantom'
          Write-Host "  Duration        : $env:DURATION minutes"
          Write-Host '=================================================='

          $TOKEN = $env:DISCORD_TOKEN
          $UID   = $env:USER_ID
          $DUR   = $env:DURATION
          $nl    = [Environment]::NewLine

          $MSG  = "[Windows 10 Ultra RDP] 60 FPS SESSION ACTIVE" + $nl
          $MSG += "Operator: <@$UID>" + $nl + $nl
          $MSG += "Quick Connect (Native RDP Client):" + $nl
          $MSG += "Computer : bore.pub:$PORT" + $nl
          $MSG += "Username : xploit" + $nl
          $MSG += "Password : phantom" + $nl
          $MSG += "Duration : $DUR minutes" + $nl + $nl

          if ($CF_ACTIVE -and $CF_MODE -like "*Zero Trust*") {
            $MSG += "Cloudflare Zero Trust Tunnel: Active (Low-Latency Edge Routing)" + $nl
            $MSG += "Connect via browser dashboard or cloudflared access rdp for minimum ping." + $nl + $nl
          } elseif ($CF_ACTIVE -and $CF_URL) {
            $MSG += "Cloudflare Quick Tunnel: $CF_URL" + $nl + $nl
          }

          $MSG += "Gaming & High-FPS Optimizations Injected:" + $nl
          $MSG += "- Option 1 (60 FPS Unlock): DWM8FrameRate = 60" + $nl
          $MSG += "- Option 2 (Zero Jitter TCP): TCPNoDelay & TcpAckFrequency=1" + $nl
          $MSG += "- Option 3 (RemoteFX AVC444): Hardware H.264 Codec & 3D Acceleration" + $nl
          $MSG += "- Option 4 (Cloudflare/Direct): Dual-Link Routing Active" + $nl + $nl

          $MSG += "Client Pro-Tip for 60 FPS on your PC:" + $nl
          $MSG += "1. Open mstsc -> Display tab -> Set Colors to High Color (16-bit)." + $nl
          $MSG += "2. In Experience tab -> Set connection to LAN (10 Mbps or higher)."

          $chanFile  = "$env:TEMP\chan.json"
          $msgFile   = "$env:TEMP\msg.json"
          $utf8NoBOM = [System.Text.UTF8Encoding]::new($false)
          $chanJson  = [pscustomobject]@{ recipient_id = $UID } | ConvertTo-Json -Compress
          $msgJson   = [pscustomobject]@{ content = $MSG } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($chanFile, $chanJson, $utf8NoBOM)
          [System.IO.File]::WriteAllText($msgFile,  $msgJson,  $utf8NoBOM)

          $AUTH   = "Authorization: Bot $TOKEN"
          $dmSent = $false

          $chanResp = curl.exe -s -X POST 'https://discord.com/api/v10/users/@me/channels' `
            -H $AUTH -H 'Content-Type: application/json' --data "@$chanFile"
          Write-Host "Chan resp: $chanResp"
          $CID = ($chanResp | ConvertFrom-Json -ErrorAction SilentlyContinue).id

          if ($CID) {
            $sendResp = curl.exe -s -X POST "https://discord.com/api/v10/channels/$CID/messages" `
              -H $AUTH -H 'Content-Type: application/json' --data "@$msgFile"
            Write-Host "DM resp: $sendResp"
            if ($sendResp -notmatch '"code"') { $dmSent = $true; Write-Host 'DM sent OK.' }
          }

          if (-not $dmSent) {
            Write-Host 'Trying VPS channel fallback...'
            $chanPost = curl.exe -s -X POST 'https://discord.com/api/v10/channels/1497364285645652098/messages' `
              -H $AUTH -H 'Content-Type: application/json' --data "@$msgFile"
            Write-Host "Channel resp: $chanPost"
          }

          Start-Sleep ([int]$env:DURATION * 60)
