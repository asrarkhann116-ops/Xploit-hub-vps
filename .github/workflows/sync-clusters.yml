name: Sync-All-Clusters
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '*.py'
      - '*.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cluster-2
            token_secret: CLUSTER_2_PAT
            target: "asrarkhann131-star/Xploit-hub-vps"
          - name: Cluster-3
            token_secret: CLUSTER_3_PAT
            target: "asrarkhann125-cloud/Xploit-hub-vps"
          - name: Cluster-4
            token_secret: CLUSTER_4_PAT
            target: "asrarkhann127-glitch/Xploit-hub-vps"
    steps:
      - name: Checkout Mother Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to ${{ matrix.name }}
        env:
          CLUSTER_PAT: ${{ secrets[matrix.token_secret] }}
        run: |
          if [ -z "$CLUSTER_PAT" ]; then
            echo "⚠️ No PAT found for ${{ matrix.name }}, skipping..."
            exit 0
          fi
          git remote add cluster https://x-access-token:${CLUSTER_PAT}@github.com/${{ matrix.target }}.git
          git push cluster main --force
          echo "✅ Synced to ${{ matrix.name }} (${{ matrix.target }})"
