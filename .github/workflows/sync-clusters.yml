name: Sync-All-Clusters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '*.js'
      - '*.json'
      - '*.py'
      - '*.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cluster-12
            token_secret: CLUSTER_12_PAT
            target: "asrarkhann122-eng/ubiquitous-sniffle"
          - name: Cluster-13
            token_secret: CLUSTER_13_PAT
            target: "asrarkhann119-eng/pxloit-buh-spv"
          - name: Cluster-14
            token_secret: CLUSTER_14_PAT
            target: "asrarkhann136-coder/crook"
          - name: Cluster-15
            token_secret: CLUSTER_15_PAT
            target: "termuxhexrt/Xploit-VPS-System"
          - name: Cluster-16
            token_secret: CLUSTER_16_PAT
            target: "asrarkhann145-spec/spec-about-dell-latitude-e6540"
          - name: Cluster-17
            token_secret: CLUSTER_17_PAT
            target: "arvindvincenzo/Xploit-hub-vpsq"
    steps:
      - name: Checkout Mother Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to ${{ matrix.name }}
        continue-on-error: true
        env:
          CLUSTER_PAT: ${{ secrets[matrix.token_secret] }}
        run: |
          if [ -z "$CLUSTER_PAT" ]; then
            echo "⚠️ No PAT found for ${{ matrix.name }}, skipping..."
            exit 0
          fi
          # Stealth: orphan branch with generic author — zero trace to Mother
          git checkout --orphan stealth-push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project files"
          git remote add cluster https://x-access-token:${CLUSTER_PAT}@github.com/${{ matrix.target }}.git
          if git push cluster stealth-push:main --force; then
            echo "✅ Synced to ${{ matrix.name }} (${{ matrix.target }})"
          else
            echo "⚠️ Push failed to ${{ matrix.name }} (Account may be suspended/token expired). Continuing..."
            exit 1
          fi
