name: Xploit-HUB-VPS
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: true
      user_name:
        description: 'Discord User Name'
        required: true
      duration:
        description: 'Duration in minutes'
        required: true
        default: '60'
      wallpaper_url:
        description: 'Wallpaper URL'
        required: false
        default: 'https://raw.githubusercontent.com/asrarkhann116-ops/Xploit-hub-vps/main/xploit_hub_vps_wallpaper.png'

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) }}
    steps:
      - name: 🚀 Turbocharge Virtual RAM (16GB NVMe Swapfile)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "✅ 16GB NVMe Swap Active! Total Memory: ~23GB"
          free -h

      - name: Install xRDP + Desktop + Arsenal
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp xfce4 xfce4-goodies dbus-x11 tigervnc-standalone-server \
            curl jq figlet zip wget unzip git vim nano tmux \
            nmap sqlmap dirb net-tools ncat python3 python3-pip 2>/dev/null || true

          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.2.3/nuclei_3.2.3_linux_amd64.zip \
            -O nuclei.zip 2>/dev/null || true
          unzip -q nuclei.zip 2>/dev/null && sudo mv nuclei /usr/local/bin/ 2>/dev/null || true
          rm -f nuclei.zip

      - name: Configure xRDP + Create User + Apply Wallpaper
        env:
          WALLPAPER_URL: ${{ github.event.inputs.wallpaper_url || 'https://raw.githubusercontent.com/asrarkhann116-ops/Xploit-hub-vps/main/xploit_hub_vps_wallpaper.png' }}
        run: |
          # Create user — add to ssl-cert group (required for xRDP on Ubuntu)
          sudo useradd -m -s /bin/bash xploit
          echo "xploit:phantom" | sudo chpasswd
          sudo usermod -aG sudo,ssl-cert xploit

          # Pre-create xfce4 config dirs so session doesn't try to write them during launch
          sudo mkdir -p /home/xploit/.config/xfce4/xfconf/xfce-perchannel-xml
          sudo mkdir -p /home/xploit/.local/share/xfce4
          sudo mkdir -p /home/xploit/.cache/sessions
          sudo mkdir -p /usr/share/backgrounds/xploit

          # Download and apply default / selected wallpaper
          sudo mkdir -p /usr/share/backgrounds/xfce
          sudo curl -sL "$WALLPAPER_URL" -o /usr/share/backgrounds/xfce/xploit_wallpaper.png || true
          sudo cp -f /usr/share/backgrounds/xfce/xploit_wallpaper.png /usr/share/backgrounds/xfce/xfce-blue.jpg 2>/dev/null || true
          sudo cp -f /usr/share/backgrounds/xfce/xploit_wallpaper.png /usr/share/backgrounds/xfce/xfce-teal.jpg 2>/dev/null || true
          sudo cp -f /usr/share/backgrounds/xfce/xploit_wallpaper.png /usr/share/backgrounds/xfce/xfce-stripes.png 2>/dev/null || true

          # Autostart wallpaper setter script on desktop login
          sudo mkdir -p /home/xploit/.config/autostart
          sudo bash -c "printf '[Desktop Entry]\nType=Application\nExec=sh -c \"sleep 2 && for p in \$(xfconf-query -c xfce4-desktop -l | grep last-image); do xfconf-query -c xfce4-desktop -p \$p -s /usr/share/backgrounds/xfce/xploit_wallpaper.png; done\"\nHidden=false\nNoDisplay=false\nX-GNOME-Autostart-enabled=true\nName=Set Wallpaper\n' > /home/xploit/.config/autostart/set-wallpaper.desktop"

          sudo chown -R xploit:xploit /home/xploit

          # Set session: xploit's .xsession tells Xsession to run startxfce4
          echo "startxfce4" | sudo tee /home/xploit/.xsession > /dev/null
          sudo chmod +x /home/xploit/.xsession
          sudo chown xploit:xploit /home/xploit/.xsession

          # KEY FIX: Use /etc/X11/Xsession — this is the system session handler that
          # properly initialises D-Bus AND sets XDG_CONFIG_DIRS before calling the DE.
          # dbus-launch alone doesn't work because xfce4-session needs the bus address
          # set BEFORE it even starts. Xsession handles this correctly.
          sudo bash -c "printf '#!/bin/sh\nif [ -r /etc/default/locale ]; then\n  . /etc/default/locale\n  export LANG LANGUAGE\nfi\nexec /etc/X11/Xsession\n' > /etc/xrdp/startwm.sh"
          sudo chmod +x /etc/xrdp/startwm.sh

          # Lower color depth for stability
          sudo sed -i 's/max_bpp=32/max_bpp=24/' /etc/xrdp/xrdp.ini 2>/dev/null || true

          sudo systemctl enable xrdp 2>/dev/null || true
          sudo systemctl start xrdp
          sleep 4

          echo "--- xRDP status ---"
          sudo systemctl status xrdp --no-pager || true
          ss -tlnp | grep 3389 || true

      - name: Bore Tunnel + Send DM
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          USER_ID: ${{ github.event.inputs.user_id }}
          USER_NAME: ${{ github.event.inputs.user_name }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          curl -sL -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore.tar.gz && chmod +x bore

          nohup ./bore local 3389 --to bore.pub > bore.log 2>&1 &

          PORT=""
          for i in $(seq 1 30); do
            PORT=$(grep -o 'bore\.pub:[0-9]*' bore.log 2>/dev/null | cut -d':' -f2 | head -n 1)
            [ -z "$PORT" ] && PORT=$(grep -o 'remote_port=[0-9]*' bore.log 2>/dev/null | cut -d'=' -f2 | head -n 1)
            [ -n "$PORT" ] && break
            sleep 3
          done

          CID=$(curl -s -H "Authorization: Bot $DISCORD_TOKEN" -H "Content-Type: application/json" \
            -X POST -d "{\"recipient_id\": \"$USER_ID\"}" \
            https://discord.com/api/v10/users/@me/channels | jq -r '.id')

          if [ -z "$PORT" ]; then
            curl -s -H "Authorization: Bot $DISCORD_TOKEN" -H "Content-Type: application/json" \
              -X POST -d "{\"content\": \"❌ **Ubuntu VPS Launch Failed** — bore tunnel could not start. Please try again.\"}" \
              "https://discord.com/api/v10/channels/$CID/messages"
            exit 1
          fi

          curl -s -H "Authorization: Bot $DISCORD_TOKEN" -H "Content-Type: application/json" \
            -X POST -d "{\"content\": \"🐧 **UBUNTU 22.04 xRDP — SESSION ACTIVE**\n👤 **Operator:** <@$USER_ID>\n\n🖥️ **Open Remote Desktop Connection:**\n**Computer:** \`bore.pub:$PORT\`\n**Username:** \`xploit\`\n**Password:** \`phantom\`\n\n*Accept any certificate warnings.*\n⏱ **Duration:** $DURATION minutes\n\n**Tools:** Nmap, SQLMap, Nuclei, Dirb\"}" \
            "https://discord.com/api/v10/channels/$CID/messages"

          while true; do sleep 3600; done
